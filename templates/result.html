<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hasil Analisis Sentimen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f8fb; }
        .navbar { background-color: #007bff; }
        .navbar-brand { color: white; font-weight: bold; }
        .card { margin-top: 30px; }
    </style>
</head>
<body>
    <nav class="navbar p-3">
        <div class="container-fluid">
            <span class="navbar-brand">Analisis Komentar Tiktok</span>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow p-4">
            <h3 class="mb-3">Hasil Analisis Sentimen</h3>
            <p><strong>Komentar:</strong> {{ comment }}</p>
            <p><strong>Sentimen:</strong> 
                <span class="badge {% if sentiment == 'Positif' %}bg-success{% else %}bg-danger{% endif %}">
                    {{ sentiment }}
                </span>
            </p>
            <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Kembali</a>
        </div>
    </div>
</body>
</html>
